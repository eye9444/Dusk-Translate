<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LN Translator</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Syne:wght@400;600;700&family=DM+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --ink: #1a1410; --paper: #f5f0e8; --aged: #e8dfc8;
  --accent: #c0392b; --muted: #8a7d6b; --border: #c8bfa8;
  --success: #2d6a4f; --panel: #ede8dc;
}

/* Eclipse Mode - True Black & Fiery Orange */
body.eclipse {
  --ink: #e8e8e8; --paper: #000000; --aged: #0d0d0d;
  --accent: #ff4500; --muted: #555555; --border: #2a2a2a;
  --success: #4ade80; --panel: #0a0a0a;
}
body.eclipse .key-bar        { border-bottom-color: #ff4500; }
body.eclipse header           { border-bottom-color: #ff4500; }
body.eclipse .sidebar         { border-right-color: #ff4500; }
body.eclipse .sidebar-hdr     { border-bottom-color: #331500; }
body.eclipse .ch-item         { border-bottom-color: #1a1a1a; }
body.eclipse .controls        { border-bottom-color: #331500; }
body.eclipse .pane-left       { border-right-color: #331500; }
body.eclipse .pane-lbl        { border-bottom-color: #331500; }
body.eclipse .glossary-bar    { border-bottom-color: #331500; }
body.eclipse .ch-item.active {
  background: transparent;
  color: #e8e8e8;
  box-shadow: inset 0 0 0 1.5px #e8e8e8;
}
body.eclipse .ch-item.active .ch-id   { color: #ff4500; }
body.eclipse .ch-item.active .ch-meta { color: #888888; }
body.eclipse .ch-item.active .done-mark { color: #4ade80; }
body.eclipse .ch-item:hover { background: rgba(255,69,0,0.08); }
body.eclipse .statusbar       { background: #1a1a1a; color: #e8e8e8; }
body.eclipse .key-input-wrap button svg { stroke: #e8e8e8; }
body.eclipse .theme-switcher svg        { stroke: #e8e8e8; }
body.eclipse .theme-switcher            { border-color: #333; }
body.eclipse .theme-switcher:hover      { background: #1a1a1a; border-color: #ff4500; }
body.eclipse .btn:hover:not(:disabled)  { background: #ff4500; border-color: #ff4500; color: #000; }
body.eclipse .btn.primary               { background: #ff4500; border-color: #ff4500; color: #000; }
body.eclipse .btn.primary:hover:not(:disabled) { background: #cc3700; border-color: #cc3700; }
body.eclipse .btn.danger                { background: #1a0a00; border-color: #ff4500; color: #ff4500; }
body.eclipse .btn.danger:hover:not(:disabled)  { background: #ff4500; color: #000; }
body.eclipse .glossary-toggle           { border-color: #e8e8e8; color: #e8e8e8; }
body.eclipse .glossary-toggle:hover,
body.eclipse .glossary-toggle.active    { background: #e8e8e8; color: #000; }
body.eclipse ::-webkit-scrollbar              { width: 6px; height: 6px; }
body.eclipse ::-webkit-scrollbar-track        { background: transparent; }
body.eclipse ::-webkit-scrollbar-thumb        { background: #333333; border-radius: 3px; }
body.eclipse ::-webkit-scrollbar-thumb:hover  { background: #555555; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: 'Syne', sans-serif; min-height: 100vh; }

.key-bar {
  background: var(--aged); border-bottom: 2px solid var(--border);
  padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.key-bar label { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.key-bar select {
  font-family: 'DM Mono', monospace; font-size: .78rem;
  padding: 6px 10px; border: 1.5px solid var(--border); background: var(--paper); color: var(--ink); border-radius: 4px;
}
.key-input-wrap { display: flex; align-items: center; }
.key-input-wrap input {
  font-family: 'DM Mono', monospace; font-size: .78rem;
  padding: 6px 10px; border: 1.5px solid var(--border); background: var(--paper); color: var(--ink);
  border-radius: 4px 0 0 4px; min-width: 210px;
}
.key-input-wrap button {
  padding: 5px 8px; border: 1.5px solid var(--border); border-left: none;
  background: var(--panel); cursor: pointer; border-radius: 0 4px 4px 0; font-size: .75rem;
  display: flex; align-items: center; justify-content: center;
}
.key-input-wrap button svg { width: 14px; height: 14px; stroke: var(--ink); }
.key-status { font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--muted); }
.key-status.ok { color: var(--success); }
.key-status.err { color: var(--accent); }

header { border-bottom: 2px solid var(--border); padding: 14px 24px; display: flex; align-items: baseline; gap: 14px; background: var(--aged); }
header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
header .sub { font-family: 'DM Mono', monospace; font-size: .72rem; color: var(--muted); }
.glossary-toggle { 
  margin-left: auto; padding: 6px 12px; font-family: 'Syne', sans-serif; 
  font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink); 
  cursor: pointer; transition: all .12s; border-radius: 3px;
}
.glossary-toggle:hover { background: var(--ink); color: var(--paper); }
.glossary-toggle.active { background: var(--ink); color: var(--paper); }

.theme-switcher {
  margin-left: 12px; width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--border); background: transparent;
  cursor: pointer; transition: all .15s; position: relative;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.theme-switcher:hover { background: var(--aged); border-color: var(--ink); }
.theme-switcher svg { width: 16px; height: 16px; stroke: var(--ink); transition: stroke .15s; }
.theme-switcher::after {
  content: attr(data-theme);
  position: absolute; top: 100%; right: 0; margin-top: 8px;
  background: var(--ink); color: var(--paper);
  font-family: 'DM Mono', monospace; font-size: .65rem;
  padding: 4px 8px; border-radius: 3px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.theme-switcher:hover::after { opacity: 1; }

.layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 112px); }
.sidebar { border-right: 2px solid var(--ink); background: var(--aged); overflow-y: auto; max-height: calc(100vh - 112px); position: sticky; top: 0; scrollbar-width: none; }
.sidebar::-webkit-scrollbar { display: none; }
.sidebar-hdr { padding: 11px 14px; font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
.ch-item { padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .12s; }
.ch-item:hover { background: rgba(192,57,43,.07); }
.ch-item.active { background: var(--ink); color: var(--paper); }
.ch-id { font-family: 'DM Mono', monospace; font-size: .65rem; color: var(--muted); margin-bottom: 2px; }
.ch-item.active .ch-id { color: #c8a87a; }
.ch-title { font-size: .78rem; font-weight: 600; line-height: 1.35; }
.ch-meta { font-size: .65rem; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }
.ch-item.active .ch-meta { color: #9a8e7a; }
.done-mark { color: var(--success); font-weight: 700; }
.ch-item.active .done-mark { color: #7ec8a0; }
.partial-mark { color: #b07d00; font-weight: 700; }

.controls { padding: 11px 18px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { font-family: 'Syne', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 7px 14px; border: 2px solid var(--ink); cursor: pointer; transition: all .12s; background: transparent; color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover:not(:disabled) { background: #a93226; border-color: #a93226; }
.btn.danger { background: #fde; border-color: var(--accent); color: var(--accent); }
.btn.danger:hover:not(:disabled) { background: var(--accent); color: white; }
.btn.sm { padding: 4px 9px; font-size: .65rem; }
select { font-family: 'Syne', sans-serif; font-size: .72rem; font-weight: 600; padding: 7px 10px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
.prog { font-family: 'DM Mono', monospace; font-size: .68rem; color: var(--muted); margin-left: auto; }

.panes { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 165px); }
.pane { overflow-y: auto; padding: 18px 22px; max-height: calc(100vh - 165px); }
.pane-left { border-right: 1px solid var(--border); }
.pane-lbl { font-size: .63rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; padding-bottom: 5px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
.pane-lbl .acts { margin-left: auto; display: flex; gap: 4px; }
.src-txt { font-family: 'Shippori Mincho', serif; font-size: .98rem; line-height: 2; white-space: pre-wrap; word-break: break-word; }
.tl-out { font-family: 'Shippori Mincho', serif; font-size: .98rem; line-height: 2; white-space: pre-wrap; word-break: break-word; outline: none; min-height: 120px; }
.tl-out:empty::before { content: 'Translation will appear here…'; color: var(--muted); font-family: 'Syne', sans-serif; font-size: .82rem; font-style: italic; }
.partial-badge { font-family: 'DM Mono', monospace; font-size: .65rem; background: #fef3cd; color: #7d5a00; border-radius: 3px; padding: 1px 6px; margin-left: 6px; }
.cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: text-bottom; animation: blink 1s step-end infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 165px); gap: 14px; grid-column: 1 / -1; text-align: center; }
.empty-state p { font-family: 'DM Mono', monospace; font-size: .8rem; color: var(--muted); line-height: 1.8; max-width: 380px; }

.statusbar { position: fixed; bottom: 0; left: 230px; right: 0; background: var(--ink); color: var(--paper); font-family: 'DM Mono', monospace; font-size: .7rem; padding: 7px 18px; display: flex; align-items: center; gap: 8px; transform: translateY(100%); transition: transform .18s; z-index: 100; }
.statusbar.show { transform: translateY(0); }
.spin { width: 11px; height: 11px; border: 2px solid rgba(255,255,255,.25); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.provider-badge { font-family: 'DM Mono', monospace; font-size: .65rem; padding: 2px 6px; border-radius: 3px; margin-left: auto; }
.provider-badge.or { background: #7c3aed; color: white; }
.provider-badge.ai { background: #1a6b3a; color: white; }

.glossary-bar {
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 8px 24px; display: flex; align-items: center; gap: 12px;
  max-height: 68px; overflow: hidden; transition: max-height .25s ease-in-out, padding .25s ease-in-out;
}
.glossary-bar.collapsed {
  max-height: 0; padding-top: 0; padding-bottom: 0; border-bottom: none;
}
.glossary-bar label { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.glossary-bar textarea {
  flex: 1; font-family: 'DM Mono', monospace; font-size: .72rem; padding: 5px 8px;
  border: 1.5px solid var(--border); background: var(--paper); color: var(--ink);
  border-radius: 4px; resize: none; height: 52px; line-height: 1.6;
}
.glossary-hint { font-family: 'DM Mono', monospace; font-size: .65rem; color: var(--muted); line-height: 1.8; }
</style>
</head>
<body>

<div class="key-bar">
  <label>API Key</label>
  <div class="key-input-wrap">
    <input type="text" id="api-key" placeholder="AIza… or sk-or-v1-…" oninput="onKeyInput()">
    <button onclick="toggleVis()" id="vis-btn">
      <svg id="eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="2" fill="none"/>
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
        <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
  </div>
  <label>Model</label>
  <select id="model-select" onchange="onKeyInput()">
    <optgroup label="── AI Studio (AIza… key) ──">
      <option value="ai|gemini-3-flash-preview">Gemini 3 Flash Preview</option>
      <option value="ai|gemini-2.5-flash">Gemini 2.5 Flash (free)</option>
      <option value="ai|gemini-2.0-flash">Gemini 2.0 Flash (free)</option>
      <option value="ai|gemini-2.0-flash-lite">Gemini 2.0 Flash Lite (free)</option>
      <option value="ai|gemma-4-31b-it">Gemma 4 31B (free)</option>
      <option value="ai|gemma-3-27b-it">Gemma 3 27B (free)</option>
    </optgroup>
    <optgroup label="── OpenRouter (sk-or-… key) ──">
      <option value="or|google/gemini-2.0-flash-001">Gemini 2.0 Flash (free)</option>
      <option value="or|deepseek/deepseek-chat">DeepSeek V3 (free)</option>
    </optgroup>
  </select>
  <span class="key-status" id="key-status">Enter your API key</span>
</div>

<header>
  <h1>DuskTranslate</h1>
  <span class="sub">JP → EN · chapter-by-chapter · AI Studio &amp; OpenRouter</span>
  <button class="glossary-toggle" onclick="toggleGlossary()">Glossary</button>
  <button class="theme-switcher" onclick="toggleTheme()" data-theme="Dusk Mode" id="theme-btn">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
  </button>
</header>

<div class="glossary-bar collapsed" id="glossary-bar">
  <label>Glossary</label>
  <textarea id="glossary" placeholder="シャル = Charlotte&#10;明人 = Akihito&#10;花音 = Kanon&#10;One entry per line, format: Japanese = English"></textarea>
  <span class="glossary-hint">One entry per line<br>Japanese = English</span>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-hdr">Chapters</div>
    <div id="ch-list"></div>
  </aside>

  <div style="display:flex;flex-direction:column;">
    <div class="controls">
      <button class="btn primary" id="btn-tl" onclick="translateCurrent()" disabled>Translate chapter</button>
      <button class="btn danger sm" id="btn-abort" onclick="abortTranslation()" style="display:none">Stop</button>
      <button class="btn" id="btn-prev" onclick="go(-1)" disabled>← Prev</button>
      <button class="btn" id="btn-next" onclick="go(1)" disabled>Next →</button>
      <select id="style-sel">
        <option value="natural">Natural / localized</option>
        <option value="faithful">Faithful / literal</option>
        <option value="liberal">Liberal / creative</option>
      </select>
      <button class="btn sm" id="btn-export" onclick="doExport()" disabled>Export TXT</button>
      <button class="btn sm" id="btn-epub-export" onclick="doEpubExport()" disabled title="Export translated EPUB (requires original EPUB to have been loaded)">Export EPUB</button>
      <button class="btn sm" id="btn-src-export" onclick="doSourceExport()" disabled title="Export raw source JSON for debugging">Export Source JSON</button>
      <button class="btn sm" id="btn-import" onclick="document.getElementById('ti').click()" disabled>Import TXT</button>
      <input type="file" id="ti" accept=".txt" style="display:none" onchange="importTXT(event)">
      <span class="prog" id="prog">0 / 0</span>
    </div>

    <div class="empty-state" id="empty-state">
      <div style="font-size:2rem">📖</div>
      <p id="empty-text">Enter your API key above, then load an EPUB or novel_source.json.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <button class="btn primary" onclick="document.getElementById('fi-epub').click()" disabled id="load-btn">Load EPUB</button>
        <button class="btn" onclick="document.getElementById('fi').click()" disabled id="load-json-btn" style="font-size:.68rem">Load JSON</button>
      </div>
      <input type="file" id="fi-epub" accept=".epub" style="display:none" onchange="loadEpub(event)">
      <input type="file" id="fi" accept=".json" style="display:none" onchange="loadFile(event)">
    </div>

    <div class="panes" id="panes" style="display:none">
      <div class="pane pane-left">
        <div class="pane-lbl">
          🇯🇵 Source
          <span id="src-cnt" style="font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted)"></span>
          <div class="acts"><button class="btn sm" onclick="copySrc()">Copy</button></div>
        </div>
        <div class="src-txt" id="src-txt"></div>
      </div>
      <div class="pane">
        <div class="pane-lbl">
          🇬🇧 Translation
          <div class="acts">
            <button class="btn sm" onclick="retryTranslation()">Retry</button>
            <button class="btn sm" onclick="copyTl()">Copy</button>
            <button class="btn sm" onclick="clearTl()">Clear</button>
          </div>
        </div>
        <div class="tl-out" id="tl-out" contenteditable="true" spellcheck="true"></div>
      </div>
    </div>
  </div>
</div>

<div class="statusbar" id="statusbar">
  <div class="spin" id="spin"></div>
  <span id="status-text"></span>
  <span class="provider-badge" id="provider-badge" style="display:none"></span>
</div>

<script>
let novel = null, cur = 0, translations = {}, busy = false;
let abortCtrl = null, watchdog = null;
let hidden = false;
let epubZip = null; // stores the original JSZip object for epub round-trip

function getKey()      { return document.getElementById('api-key').value.trim(); }
function getModelVal() { return document.getElementById('model-select').value; }
function getProvider() { return getModelVal().split('|')[0]; }
function getModel()    { return getModelVal().split('|')[1]; }

function toggleVis() {
  const inp = document.getElementById('api-key');
  const icon = document.getElementById('eye-icon');
  hidden = !hidden;
  inp.style.webkitTextSecurity = hidden ? 'disc' : '';
  inp.style.letterSpacing = hidden ? '2px' : '';
  
  // Switch between eye-slash and eye
  if (hidden) {
    icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>';
  } else {
    icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>';
  }
}

function isAIKey(k)  { return k.startsWith('AIza') && k.length > 20; }
function isORKey(k)  { return k.startsWith('sk-or-') && k.length > 20; }
function keyMatchesProvider(k, p) {
  if (p === 'ai') return isAIKey(k);
  if (p === 'or') return isORKey(k);
  return false;
}
function isReady() { return keyMatchesProvider(getKey(), getProvider()); }

function onKeyInput() {
  const k = getKey(), p = getProvider();
  const el = document.getElementById('key-status');
  if (k.length === 0) {
    el.textContent = 'Enter your API key'; el.className = 'key-status';
  } else if (keyMatchesProvider(k, p)) {
    el.textContent = `✓ ${p === 'ai' ? 'AI Studio' : 'OpenRouter'} key set — ready`; el.className = 'key-status ok';
  } else if (p === 'ai' && isORKey(k)) {
    el.textContent = 'That looks like an OpenRouter key — select an OR· model'; el.className = 'key-status err';
  } else if (p === 'or' && isAIKey(k)) {
    el.textContent = 'That looks like an AI Studio key — select a Gemini model'; el.className = 'key-status err';
  } else if (p === 'ai') {
    el.textContent = 'AI Studio key should start with AIza…'; el.className = 'key-status err';
  } else {
    el.textContent = 'OpenRouter key should start with sk-or-…'; el.className = 'key-status err';
  }
  const ready = isReady();
  document.getElementById('load-btn').disabled = !ready;
  document.getElementById('load-json-btn').disabled = !ready;
  if (novel) document.getElementById('btn-tl').disabled = !ready;
  if (ready) document.getElementById('empty-text').innerHTML = 'Load an EPUB to begin, or a JSON if you already extracted one.<br>Drag onto the page or click a button.';
}

document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => {
  e.preventDefault();
  if (!isReady()) { setStatus('Enter your API key first'); return; }
  const f = e.dataTransfer.files[0];
  if (!f) return;
  if (f.name.endsWith('.epub')) readEpub(f);
  else if (f.name.endsWith('.json')) readJSON(f);
});

function loadFile(e) {
  if (!isReady()) { setStatus('Enter your API key first'); return; }
  const f = e.target.files[0]; if (f) readJSON(f);
}

function loadEpub(e) {
  if (!isReady()) { setStatus('Enter your API key first'); return; }
  const f = e.target.files[0]; if (f) readEpub(f);
}

function readJSON(f) {
  const r = new FileReader();
  r.onload = ev => {
    try { novel = JSON.parse(ev.target.result); initUI(); }
    catch(err) { setStatus('Parse error: ' + err.message); }
  };
  r.readAsText(f);
}

// ── EPUB PARSER ──────────────────────────────────────────────
async function readEpub(f) {
  setStatus('Parsing EPUB…', true);
  try {
    const buf = await f.arrayBuffer();
    epubZip = await JSZip.loadAsync(buf);

    // Find OPF
    const container = await epubZip.file('META-INF/container.xml').async('text');
    const opfPath = container.match(/full-path="([^"]+\.opf)"/)?.[1];
    if (!opfPath) throw new Error('Cannot find OPF in container.xml');
    const opfDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
    const opfText = await epubZip.file(opfPath).async('text');

    // Parse spine order
    const spineIds = [...opfText.matchAll(/<itemref[^>]+idref="([^"]+)"/g)].map(m => m[1]);
    // Build id -> href map
    const itemHrefs = {};
    for (const m of opfText.matchAll(/<item[^>]+id="([^"]+)"[^>]+href="([^"]+)"/g)) {
      itemHrefs[m[1]] = m[2];
    }

    const chapters = [];
    for (const id of spineIds) {
      const relHref = itemHrefs[id];
      if (!relHref || !relHref.endsWith('.xhtml')) continue;
      const fullPath = opfDir + relHref;
      const xhtmlFile = epubZip.file(fullPath);
      if (!xhtmlFile) continue;
      const xhtml = await xhtmlFile.async('text');

      // Skip image-only pages (body has class p-image or no <p> text content)
      if (/class="p-image"/.test(xhtml)) continue;

      // Extract text: strip ruby <rt>, replace inline img alt, strip remaining tags
      const text = extractTextFromXhtml(xhtml);
      const jpChars = (text.match(/[぀-鿿]/g) || []).length;
      if (jpChars < 30) continue; // skip near-empty pages

      // Store xhtml path for round-trip
      chapters.push({ id: id, xhtmlPath: fullPath, text, jp_char_count: jpChars });
    }

    novel = { chapters, _epubOpfPath: opfPath, _epubOpfDir: opfDir };
    initUI();
    setStatus(`✓ Parsed ${chapters.length} text chapters from EPUB`);
    setTimeout(hideStatus, 2500);
  } catch(err) {
    setStatus('EPUB parse error: ' + err.message);
    console.error(err);
  }
}

function extractTextFromXhtml(xhtml) {
  // Strip <head> entirely so <title> doesn't bleed into extracted text
  let s = xhtml.replace(/<head[\s\S]*?<\/head>/gi, '');
  // Normalize CRLF to LF first (epub xhtml files often use Windows line endings)
  s = s.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  s = s.replace(/<rt[^>]*>[\s\S]*?<\/rt>/gi, '');
  s = s.replace(/<img[^>]+alt="([^"]*)"[^>]*\/?>/gi, function(_, alt) { return alt || ''; });
  s = s.replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/<\/(p|h1|h2|h3|h4|div|li)>/gi, '\n');
  s = s.replace(/<[^>]+>/g, '');
  s = s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ');
  s = s.replace(/&#([0-9]+);/g, function(_, n) { return String.fromCharCode(parseInt(n)); });
  // Collapse any run of 3+ newlines down to 2
  s = s.replace(/\n{3,}/g, '\n\n').trim();
  return s;
}

// ── EPUB EXPORTER ────────────────────────────────────────────
async function doEpubExport() {
  if (!novel || !epubZip) { setStatus('Load an EPUB first — JSON-loaded novels cannot export to EPUB'); return; }
  const done = novel.chapters.filter(ch => translations[ch.id]);
  if (done.length === 0) { setStatus('Nothing translated yet.'); return; }

  setStatus(`Building EPUB (${done.length} chapters)…`, true);
  try {
    // Clone the zip so we don't mutate the original
    const outZip = new JSZip();
    // Copy all files verbatim first
    const filePromises = [];
    epubZip.forEach((relPath, zipEntry) => {
      if (!zipEntry.dir) {
        filePromises.push(
          zipEntry.async('arraybuffer').then(buf => outZip.file(relPath, buf, { binary: true }))
        );
      }
    });
    await Promise.all(filePromises);

    // Patch OPF: switch page-progression-direction rtl -> ltr
    const opfFile = outZip.file(novel._epubOpfPath);
    if (opfFile) {
      var opfText = await opfFile.async('text');
      opfText = opfText.replace(/page-progression-direction="rtl"/g, 'page-progression-direction="ltr"');
      opfText = opfText.replace(/\s*properties="page-spread-(left|right)"/g, '');
      outZip.file(novel._epubOpfPath, opfText);
    }

    // Now patch translated xhtml files
    for (const ch of novel.chapters) {
      if (!translations[ch.id]) continue;
      const translatedText = translations[ch.id].replace('…PARTIAL', '').trim();
      const origXhtml = await epubZip.file(ch.xhtmlPath).async('text');
      const newXhtml = injectTranslation(origXhtml, translatedText);
      outZip.file(ch.xhtmlPath, newXhtml);
    }

    // Generate and download
    const blob = await outZip.generateAsync({ type: 'blob', mimeType: 'application/epub+zip', compression: 'DEFLATE', compressionOptions: { level: 6 } });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'translated.epub';
    a.click();
    setStatus(`✓ Downloaded translated.epub (${done.length}/${novel.chapters.length} chapters translated)`);
    setTimeout(hideStatus, 3000);
  } catch(err) {
    setStatus('EPUB export error: ' + err.message);
    console.error(err);
  }
}

function injectTranslation(origXhtml, translatedText) {
  var s = origXhtml
    .replace(/xml:lang="ja"/g, 'xml:lang="en"')
    .replace(/class="vrtl"/g, 'class="hltr"')
    .replace(/class="p-text"/g, 'class="p-text hltr"');

  // Inject CSS override to force LTR horizontal layout regardless of book stylesheet
  var overrideStyle = '<style>html,body,div,p,h1,h2,h3,h4,h5,h6{' +
    'writing-mode:horizontal-tb!important;' +
    '-webkit-writing-mode:horizontal-tb!important;' +
    'direction:ltr!important;' +
    'text-align:left!important;' +
    'unicode-bidi:normal!important;' +
  '}</style>';
  s = s.replace('</head>', overrideStyle + '</head>');

  var mainStart = s.indexOf('<div class="main">');
  var bodyClose = s.lastIndexOf('</body>');
  if (mainStart === -1 || bodyClose === -1) return s;

  var depth = 0, i = mainStart, mainEnd = -1;
  while (i < bodyClose) {
    if (s.startsWith('<div', i)) depth++;
    else if (s.startsWith('</div>', i)) { depth--; if (depth === 0) { mainEnd = i + 6; break; } }
    i++;
  }
  if (mainEnd === -1) mainEnd = bodyClose;

  var blocks = translatedText.split(/\n\n+/);
  var paras = blocks.map(function(block) {
    var line = block.trim();
    if (!line) return '';
    if (/^[◆─━＊\*]+$/.test(line)) return '<p class="dot-line"><span>◆</span></p>';
    if (line.length < 60 && /^[A-Z「『【第]/.test(line) && !/[.!?。！？…]$/.test(line)) {
      return '<h1 class="h-indent-4em">' + escXml(line) + '</h1>';
    }
    return line.split('\n').filter(function(l) { return l.trim(); })
      .map(function(l) { return '<p>' + escXml(l.trim()) + '</p>'; }).join('\n');
  }).filter(Boolean).join('\n');

  var newMain = '<div class="main">\n\n' + paras + '\n\n</div>';
  return s.slice(0, mainStart) + newMain + s.slice(mainEnd);
}

function escXml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function initUI() {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('panes').style.display = 'grid';
  renderList(); selectCh(0);
  ['btn-prev','btn-next','btn-export','btn-import','btn-src-export'].forEach(id => document.getElementById(id).disabled = false);
  // Enable epub export only if we came from an epub
  document.getElementById('btn-epub-export').disabled = !epubZip;
  document.getElementById('btn-tl').disabled = !isReady();
  updateProg();
}

function renderList() {
  const list = document.getElementById('ch-list');
  list.innerHTML = '';
  novel.chapters.forEach((ch, i) => {
    const fl = ch.text.split('\n').find(l => l.trim().length > 2) || ch.id;
    const title = fl.slice(0, 28) + (fl.length > 28 ? '…' : '');
    const d = document.createElement('div');
    d.className = 'ch-item' + (i === 0 ? ' active' : '');
    d.id = 'ci' + i;
    d.innerHTML = `<div class="ch-id">${ch.id}</div><div class="ch-title">${title}</div><div class="ch-meta">${(ch.jp_char_count||0).toLocaleString()} chars <span id="ck${i}"></span></div>`;
    d.onclick = () => selectCh(i);
    list.appendChild(d);
  });
  Object.keys(translations).forEach(id => {
    const i = novel.chapters.findIndex(c => c.id === id);
    if (i >= 0) updateMark(i, translations[id]);
  });
}

function selectCh(i) {
  if (!novel) return;
  cur = i;
  document.querySelectorAll('.ch-item').forEach((el, j) => el.classList.toggle('active', j === i));
  document.getElementById('ci' + i)?.scrollIntoView({ block: 'nearest' });
  const ch = novel.chapters[i];
  document.getElementById('src-txt').textContent = ch.text;
  document.getElementById('src-cnt').textContent = `${(ch.jp_char_count||0).toLocaleString()} JP chars`;
  const out = document.getElementById('tl-out');
  out.innerHTML = '';
  if (translations[ch.id]) {
    const partial = translations[ch.id].endsWith('…PARTIAL');
    out.textContent = translations[ch.id].replace('…PARTIAL', '');
    if (partial) { const b = document.createElement('span'); b.className = 'partial-badge'; b.textContent = 'partial — click Retry'; out.appendChild(b); }
  }
  if (!busy) document.getElementById('btn-tl').disabled = !isReady();
}

function go(d) {
  if (!novel) return;
  const n = cur + d;
  if (n >= 0 && n < novel.chapters.length) selectCh(n);
}

async function translateCurrent() {
  if (!novel || busy || !isReady()) return;

  const ch = novel.chapters[cur];
  const style = document.getElementById('style-sel').value;
  const provider = getProvider();
  busy = true;
  document.getElementById('btn-tl').disabled = true;
  document.getElementById('btn-abort').style.display = '';

  const badge = document.getElementById('provider-badge');
  badge.textContent = provider === 'or' ? 'OpenRouter' : 'AI Studio';
  badge.className = 'provider-badge ' + provider;
  badge.style.display = '';
  setStatus('Translating ' + ch.id + '…', true);

  const styleMap = {
    natural:  'Translate naturally into readable English. Adapt idioms. Preserve honorifics (san, kun, chan, sama) as-is.',
    faithful: 'Translate faithfully and literally, staying close to original structures. Preserve all honorifics. Keep Japanese name order.',
    liberal:  'Translate with creative liberty into vivid English prose. Prioritize emotional impact. Make it feel written originally in English.'
  };

  const glossaryRaw = document.getElementById('glossary').value.trim();
  const glossaryLines = glossaryRaw.split('\n').map(l => l.trim()).filter(l => l.includes('='));
  const glossarySection = glossaryLines.length > 0
    ? `\n\nName/term glossary — always use these translations exactly:\n${glossaryLines.map(l => `- ${l}`).join('\n')}`
    : '';

  const prompt = `You are a professional Japanese-to-English light novel translator.\n\nStyle: ${styleMap[style]}${glossarySection}\n\nRules:\n- Output ONLY the translated text. No notes, no commentary.\n- Preserve paragraph breaks exactly as in the original.\n- Keep 『』「」quote marks or convert consistently to English quotes.\n- Always follow the glossary above for names and terms.\n\nJapanese text:\n${ch.text}`;

  const out = document.getElementById('tl-out');
  out.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  out.appendChild(cursor);

  abortCtrl = new AbortController();
  let lastTok = Date.now();
  watchdog = setInterval(() => {
    if (Date.now() - lastTok > 30000) { clearInterval(watchdog); abortCtrl.abort(); }
  }, 2000);

  const getTextContent = () => {
    for (const node of out.childNodes) { if (node.nodeType === 3) return node.textContent; }
    return '';
  };
  const savePartial = (full, msg) => {
    translations[ch.id] = full + '…PARTIAL';
    out.innerHTML = ''; out.textContent = full;
    const b = document.createElement('span'); b.className = 'partial-badge'; b.textContent = 'partial — click Retry'; out.appendChild(b);
    updateMark(cur, translations[ch.id]); updateProg();
    setStatus(msg);
  };

  try {
    let cleanStop;
    if (provider === 'or') {
      cleanStop = await translateOpenRouter(prompt, out, cursor, () => lastTok = Date.now(), abortCtrl);
    } else {
      cleanStop = await translateAIStudio(prompt, out, cursor, () => lastTok = Date.now(), abortCtrl);
    }

    clearInterval(watchdog);
    const full = getTextContent();
    cursor.remove();

    if (!full.trim()) {
      throw new Error('Empty response — model may be rate limited, try again');
    } else if (!cleanStop) {
      // Stream closed without a proper stop signal — silently incomplete
      savePartial(full, '⚠ Stream ended early — partial saved. Click Retry.');
    } else {
      translations[ch.id] = full;
      updateMark(cur, full); updateProg();
      setStatus('✓ Done — ' + ch.id);
      setTimeout(hideStatus, 2500);
    }

  } catch (err) {
    clearInterval(watchdog);
    cursor.remove();
    const full = getTextContent();

    if (full.length > 80) {
      savePartial(full, 'Stream interrupted — partial saved. Click Retry to finish.');
    } else {
      out.textContent = '[Error: ' + err.message + ']';
      setStatus('Error: ' + err.message);
    }
  }

  busy = false;
  document.getElementById('btn-tl').disabled = false;
  document.getElementById('btn-abort').style.display = 'none';
}

async function translateOpenRouter(prompt, out, cursor, onToken, abortCtrl) {
  const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${getKey()}`,
      'Content-Type': 'application/json',
      'HTTP-Referer': 'https://ln-translator.local',
      'X-Title': 'LN Translator'
    },
    body: JSON.stringify({ model: getModel(), stream: true, messages: [{ role: 'user', content: prompt }] }),
    signal: abortCtrl.signal
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${response.status}`);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = '', cleanStop = false;
  while (true) {
    const { done, value } = await reader.read();
    if (done || abortCtrl.signal.aborted) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') { cleanStop = true; continue; }
      try {
        const parsed = JSON.parse(data);
        const token = parsed?.choices?.[0]?.delta?.content;
        if (token) { onToken(); appendToken(out, cursor, token); }
        const finish = parsed?.choices?.[0]?.finish_reason;
        if (finish === 'stop') cleanStop = true;
      } catch {}
    }
  }
  return cleanStop;
}

async function translateAIStudio(prompt, out, cursor, onToken, abortCtrl) {
  const model = getModel();
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${getKey()}`;
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ role: 'user', parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7 }
    }),
    signal: abortCtrl.signal
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${response.status}`);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = '', cleanStop = false;
  while (true) {
    const { done, value } = await reader.read();
    if (done || abortCtrl.signal.aborted) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      try {
        const parsed = JSON.parse(data);
        const token = parsed?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (token) { onToken(); appendToken(out, cursor, token); }
        const finish = parsed?.candidates?.[0]?.finishReason;
        if (finish === 'STOP') cleanStop = true;
      } catch {}
    }
  }
  return cleanStop;
}

function appendToken(out, cursor, token) {
  let textNode = null;
  for (const node of out.childNodes) { if (node.nodeType === 3) { textNode = node; break; } }
  if (textNode) textNode.textContent += token;
  else out.insertBefore(document.createTextNode(token), cursor);
  out.parentElement.scrollTop = out.parentElement.scrollHeight;
}

function abortTranslation() {
  clearInterval(watchdog); abortCtrl?.abort();
  setStatus('Stopped.');
  busy = false;
  document.getElementById('btn-tl').disabled = false;
  document.getElementById('btn-abort').style.display = 'none';
}

function retryTranslation() {
  const ch = novel?.chapters[cur];
  if (!ch) return;
  delete translations[ch.id];
  document.getElementById('tl-out').innerHTML = '';
  const ck = document.getElementById('ck' + cur);
  if (ck) { ck.textContent = ''; ck.className = ''; }
  updateProg();
  translateCurrent();
}

function updateMark(i, text) {
  const ck = document.getElementById('ck' + i);
  if (!ck) return;
  const p = text?.endsWith('…PARTIAL');
  ck.textContent = p ? ' ⚠' : ' ✓';
  ck.className = p ? 'partial-mark' : 'done-mark';
}

function copySrc() {
  const t = document.getElementById('src-txt')?.textContent || '';
  navigator.clipboard.writeText(t).then(() => { setStatus('Source copied!'); setTimeout(hideStatus, 1500); });
}

function copyTl() {
  const t = (document.getElementById('tl-out')?.textContent || '').replace('partial — click Retry', '').trim();
  navigator.clipboard.writeText(t).then(() => { setStatus('Copied!'); setTimeout(hideStatus, 1500); });
}

function clearTl() {
  const ch = novel?.chapters[cur];
  if (!ch) return;
  delete translations[ch.id];
  document.getElementById('tl-out').innerHTML = '';
  const ck = document.getElementById('ck' + cur);
  if (ck) { ck.textContent = ''; ck.className = ''; }
  updateProg();
}

function importTXT(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const text = ev.target.result;
    const chunkRe = /─{10,}\r?\n\[([^\]]+)\]\r?\n─{10,}\r?\n([\s\S]*?)(?=─{10,}\r?\n\[|$)/g;
    let match, count = 0;
    while ((match = chunkRe.exec(text)) !== null) {
      const id = match[1].trim();
      const content = match[2].trim();
      if (id && content) {
        translations[id] = content;
        count++;
        if (novel) {
          const i = novel.chapters.findIndex(c => c.id === id);
          if (i >= 0) updateMark(i, content);
        }
      }
    }
    e.target.value = '';
    if (count === 0) { setStatus("No chapters found — make sure it's an exported translation.txt"); return; }
    updateProg();
    if (novel) {
      const firstUndone = novel.chapters.findIndex(c => !translations[c.id]);
      if (firstUndone >= 0) selectCh(firstUndone);
    }
    setStatus(`✓ Imported ${count} chapter${count > 1 ? 's' : ''} — resuming from where you left off`);
    setTimeout(hideStatus, 3000);
  };
  r.readAsText(f);
}

function doSourceExport() {
  if (!novel) return;
  const blob = new Blob([JSON.stringify(novel, null, 2)], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'novel_source_debug.json'; a.click();
  setStatus('Downloaded novel_source_debug.json'); setTimeout(hideStatus, 2000);
}

function doExport() {
  if (!novel) return;
  let out = '';
  novel.chapters.forEach(ch => {
    if (translations[ch.id]) {
      out += `\n\n${'─'.repeat(60)}\n[${ch.id}]\n${'─'.repeat(60)}\n\n${translations[ch.id].replace('…PARTIAL','').trim()}`;
    }
  });
  out = out.trim();
  if (!out) { setStatus('Nothing translated yet.'); return; }
  const blob = new Blob([out], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'translation.txt';
  a.click();
  setStatus('Downloaded translation.txt');
  setTimeout(hideStatus, 2000);
}

function updateProg() {
  if (!novel) return;
  document.getElementById('prog').textContent = `${Object.keys(translations).length} / ${novel.chapters.length} translated`;
}

function setStatus(msg, spin = false) {
  document.getElementById('spin').style.display = spin ? 'block' : 'none';
  document.getElementById('status-text').textContent = msg;
  document.getElementById('statusbar').classList.add('show');
}

function hideStatus() {
  document.getElementById('statusbar').classList.remove('show');
  document.getElementById('provider-badge').style.display = 'none';
}

function toggleGlossary() {
  const bar = document.getElementById('glossary-bar');
  const btn = document.querySelector('.glossary-toggle');
  bar.classList.toggle('collapsed');
  btn.classList.toggle('active');
}

function toggleTheme() {
  const body = document.body;
  const btn = document.getElementById('theme-btn');
  
  if (body.classList.contains('eclipse')) {
    // Switch to Dusk Mode
    body.classList.remove('eclipse');
    btn.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
    btn.setAttribute('data-theme', 'Dusk Mode');
    localStorage.setItem('theme', 'dusk');
  } else {
    // Switch to Eclipse Mode
    body.classList.add('eclipse');
    btn.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
    btn.setAttribute('data-theme', 'Eclipse Mode');
    localStorage.setItem('theme', 'eclipse');
  }
}

// Load saved theme on page load
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'eclipse') {
    document.body.classList.add('eclipse');
    const btn = document.getElementById('theme-btn');
    btn.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
    btn.setAttribute('data-theme', 'Eclipse Mode');
  }
});
