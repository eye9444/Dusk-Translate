name: Publish version release

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: if gh release view "$TAG" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.existing.outputs.found != 'true'
        run: npm ci
      - name: Verify release
        if: steps.existing.outputs.found != 'true'
        run: npm test && npm run build
      - name: Tag version
        if: steps.existing.outputs.found != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
      - name: Create GitHub release
        if: steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "DuskTranslate Web $TAG"
