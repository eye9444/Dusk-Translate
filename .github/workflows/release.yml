name: Deploy production and publish release
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false
permissions:
  contents: write
  deployments: write
jobs:
  deploy:
    name: Migrate, promote, and release production
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://www.dusktranslate.com
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify accepted commit
        run: |
          npm audit --audit-level=high
          npm test
          npm run build
          npm run test:e2e
          npm run test:auth
          npm run test:modules
        env: { VITE_APP_ENV: production }
      - name: Apply production migrations
        env: { SUPABASE_DB_URL: "${{ secrets.SUPABASE_DB_URL }}" }
        run: npx supabase@2.122.0 db push --db-url "$SUPABASE_DB_URL" --include-all
      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx vercel@65.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production candidate
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}", VITE_APP_ENV: production }
        run: npx vercel@65.4.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy candidate without assigning production domains
        id: candidate
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        run: |
          URL=$(npx vercel@65.4.0 deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Smoke production candidate
        env:
          SMOKE_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run smoke:hosted
      - name: Promote candidate
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}", CANDIDATE_URL: "${{ steps.candidate.outputs.url }}" }
        run: npx vercel@65.4.0 promote "$CANDIDATE_URL" --yes --token="$VERCEL_TOKEN"
      - name: Smoke public production
        env: { SMOKE_URL: "https://www.dusktranslate.com" }
        run: npm run smoke:hosted
      - name: Read release version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: existing
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.version.outputs.tag }}" }
        run: if gh release view "$TAG" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - name: Tag verified production version
        if: steps.existing.outputs.found != 'true'
        env: { TAG: "${{ steps.version.outputs.tag }}" }
        run: git tag "$TAG" "$GITHUB_SHA" && git push origin "$TAG"
      - name: Create GitHub release
        if: steps.existing.outputs.found != 'true'
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.version.outputs.tag }}" }
        run: gh release create "$TAG" --verify-tag --generate-notes --title "DuskTranslate Web $TAG"
