<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DuskTranslate interface overview</title>
  <desc id="desc">A warm dusk-colored illustration of a chapter translator with source and translation panes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171c2a"/><stop offset="1" stop-color="#563c4c"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5eddb"/><stop offset="1" stop-color="#e7dac0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#080a10" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#sky)"/>
  <circle cx="1030" cy="-10" r="210" fill="#d06d54" opacity=".22"/>
  <circle cx="1080" cy="10" r="130" fill="#f0bd73" opacity=".12"/>
  <path d="M0 340 C190 270 310 390 510 325 S860 255 1200 330 V420 H0Z" fill="#0d111b" opacity=".72"/>
  <g filter="url(#shadow)">
    <rect x="100" y="62" width="1000" height="290" rx="16" fill="url(#paper)"/>
    <rect x="100" y="62" width="1000" height="44" rx="16" fill="#242a38"/>
    <circle cx="128" cy="84" r="6" fill="#d06d54"/><circle cx="148" cy="84" r="6" fill="#e8b66e"/><circle cx="168" cy="84" r="6" fill="#91b58d"/>
    <text x="205" y="90" fill="#f5eddb" font-family="Georgia, serif" font-size="18" font-weight="bold">DUSKTRANSLATE</text>
    <text x="920" y="90" fill="#d8cdb8" font-family="monospace" font-size="12">JP -&gt; EN</text>
    <rect x="100" y="106" width="190" height="246" fill="#ded2b8"/>
    <text x="126" y="137" fill="#756b5d" font-family="monospace" font-size="12" letter-spacing="2">CHAPTERS</text>
    <rect x="118" y="157" width="154" height="48" rx="5" fill="#29242a"/>
    <text x="130" y="178" fill="#f5eddb" font-family="Georgia, serif" font-size="13">Chapter 1</text><text x="130" y="195" fill="#cbbda8" font-family="monospace" font-size="10">10,924 chars</text>
    <text x="130" y="232" fill="#443f3c" font-family="Georgia, serif" font-size="13">Chapter 2</text><text x="130" y="249" fill="#8b806f" font-family="monospace" font-size="10">5,864 chars</text>
    <text x="130" y="286" fill="#443f3c" font-family="Georgia, serif" font-size="13">Chapter 3</text><text x="130" y="303" fill="#8b806f" font-family="monospace" font-size="10">6,343 chars</text>
    <line x1="310" y1="130" x2="1070" y2="130" stroke="#b8aa93"/>
    <text x="330" y="157" fill="#756b5d" font-family="monospace" font-size="11" letter-spacing="2">SOURCE</text><text x="705" y="157" fill="#756b5d" font-family="monospace" font-size="11" letter-spacing="2">TRANSLATION</text>
    <line x1="680" y1="141" x2="680" y2="332" stroke="#b8aa93"/>
    <g fill="#413d3a" font-family="Georgia, serif" font-size="16"><text x="330" y="194">Japanese source text goes here,</text><text x="330" y="226">with chapters and paragraphs</text><text x="330" y="258">kept easy to compare.</text><text x="705" y="194">English translation appears here,</text><text x="705" y="226">ready for review and export.</text></g>
    <rect x="330" y="294" width="118" height="28" rx="4" fill="#c64a3c"/><text x="349" y="313" fill="#fff8ed" font-family="monospace" font-size="11" font-weight="bold">TRANSLATE</text>
    <rect x="705" y="294" width="105" height="28" rx="4" fill="#29242a"/><text x="727" y="313" fill="#f5eddb" font-family="monospace" font-size="11">EXPORT</text>
  </g>
</svg>
